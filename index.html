<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="Krispy Kreme Glasuurijooks — mitteametlik fänniloodud sõõrikumäng." />
  <title>Krispy Kreme: Glasuurijooks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%A9%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div class="shop">
    <div class="awning"></div>

    <header class="marquee">
      <img class="logo" src="./assets/krispy-kreme-logo.webp" alt="Krispy Kreme" />
      <div class="marquee-text">
        <h1>Glasuuri <em>Jooks</em></h1>
        <p>Värske iga päev</p>
      </div>
    </header>

    <div class="screen">
      <canvas id="game" width="900" height="720" aria-label="Sõõrikujooksu mäng"></canvas>

      <div id="nickname-prompt" class="overlay-panel hidden">
        <label for="nickname-input">Sinu nimi edetabelis</label>
        <input id="nickname-input" maxlength="20" placeholder="Sõõrikusõber" />
        <button id="nickname-save">Salvesta</button>
      </div>

      <div id="leaderboard-panel" class="overlay-panel hidden">
        <h2>Edetabel</h2>
        <div id="leaderboard-result"></div>
        <ol id="leaderboard-list"></ol>
        <button id="leaderboard-close">Sulge</button>
      </div>
    </div>

    <div class="counter">
      <div class="kbd-hints">
        <kbd>Tühik</kbd> hüppab (kaks korda topelthüppeks)
        <kbd>&#8595;</kbd> kükita tosinakastide alt läbi
        <kbd>P</kbd> paus
      </div>
      <div class="counter-buttons">
        <button class="ghost" id="leaderboard-open">Edetabel</button>
        <button class="mute" id="mute">Heli: sees</button>
      </div>
    </div>

    <p id="leaderboard-teaser" class="teaser"></p>

    <div class="touch">
      <button id="btn-jump">Hüppa</button>
      <button id="btn-duck">Kükita</button>
    </div>

    <p class="disclaimer">
      Fänniprojekt — Krispy Kreme Eesti koostöö on kinnitamisel.
    </p>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
